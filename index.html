<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>오늘의 루틴</title>
<style>
:root {
  --bg: #0a0a0a;
  --s1: #161616;
  --s2: #202020;
  --s3: #2a2a2a;
  --border: rgba(255,255,255,0.07);
  --text: #efefef;
  --muted: #888;
  --hint: #484848;
  --blue: #5b9cf6;
  --blue-dim: rgba(91,156,246,0.12);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.12);
  --amber: #fbbf24;
  --amber-dim: rgba(251,191,36,0.12);
  --coral: #f87171;
  --coral-dim: rgba(248,113,113,0.12);
  --teal: #2dd4bf;
  --teal-dim: rgba(45,212,191,0.12);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.12);
  --r: 12px;
  --rsm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 15px; scroll-behavior: smooth; }
body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

/* 헤더 */
.hero { padding: 28px 18px 20px; }
.hero-date { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 6px; }
.hero-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
.hero-sub { font-size: 14px; color: var(--muted); margin-top: 6px; }

/* 주간 미니 캘린더 */
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 18px 20px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wday-label { font-size: 10px; color: var(--muted); }
.wday-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--muted); background: var(--s1); }
.wday-dot.today { background: var(--blue); color: #fff; }
.wday-dot.workout { background: var(--s2); color: var(--text); }
.wday-dot.rest { background: var(--s1); color: var(--hint); }

/* 섹션 */
.section { padding: 0 18px; margin-bottom: 24px; }
.section-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }

/* 카드 */
.card { background: var(--s1); border: 0.5px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 8px; }
.card-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
.card-title { font-size: 15px; font-weight: 600; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card-body { padding: 0 16px 14px; }

/* 근육통 체크 */
.soreness-box { background: var(--s1); border: 0.5px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 8px; }
.soreness-q { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.soreness-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.soreness-btn { padding: 10px 6px; border-radius: var(--rsm); border: 0.5px solid var(--border); background: var(--s2); font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: center; transition: all 0.15s; }
.soreness-btn.selected-none   { background: var(--green-dim); color: var(--green); border-color: rgba(74,222,128,0.3); }
.soreness-btn.selected-mild   { background: var(--amber-dim); color: var(--amber); border-color: rgba(251,191,36,0.3); }
.soreness-btn.selected-severe { background: var(--coral-dim); color: var(--coral); border-color: rgba(248,113,113,0.3); }

/* 알림 박스 */
.alert { padding: 12px 14px; border-radius: var(--rsm); font-size: 13px; line-height: 1.6; margin-top: 10px; display: none; }
.alert.show { display: block; }
.alert-amber { background: var(--amber-dim); color: var(--amber); }
.alert-coral { background: var(--coral-dim); color: var(--coral); }
.alert-green { background: var(--green-dim); color: var(--green); }

/* 운동 목록 */
.exercise-item { padding: 12px 0; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.exercise-item:last-child { border-bottom: none; }
.ex-left { flex: 1; }
.ex-name { font-size: 13px; font-weight: 500; }
.ex-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ex-right { text-align: right; flex-shrink: 0; }
.ex-sets { font-size: 12px; color: var(--blue); font-weight: 500; }
.ex-rest { font-size: 11px; color: var(--hint); margin-top: 2px; }
.set-pill { display:inline-flex; align-items:center; justify-content:center;
  min-width:36px; height:28px; border-radius:99px; border:0.5px solid var(--border);
  background:var(--s2); color:var(--muted); font-size:11px; font-weight:500;
  cursor:pointer; margin:2px; padding:0 8px; transition:all 0.15s; }
.set-pill-done { background:var(--green-dim); color:var(--green);
  border-color:rgba(74,222,128,0.3); }

/* 배지 */
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.badge-blue   { background: var(--blue-dim);   color: var(--blue); }
.badge-green  { background: var(--green-dim);  color: var(--green); }
.badge-amber  { background: var(--amber-dim);  color: var(--amber); }
.badge-teal   { background: var(--teal-dim);   color: var(--teal); }
.badge-coral  { background: var(--coral-dim);  color: var(--coral); }
.badge-purple { background: var(--purple-dim); color: var(--purple); }

/* C25K 인터벌 */
.interval-list { display: flex; flex-direction: column; gap: 4px; }
.iv-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--rsm); font-size: 13px; }
.iv-run     { background: var(--green-dim);  color: var(--green); font-weight: 600; }
.iv-walk    { background: var(--s2);         color: var(--muted); }
.iv-warmup  { background: var(--amber-dim);  color: var(--amber); }
.iv-cooldown{ background: var(--teal-dim);   color: var(--teal); }
.iv-easy    { background: var(--blue-dim);   color: var(--blue); }
.iv-tempo   { background: var(--purple-dim); color: var(--purple); font-weight: 600; }
.iv-speed   { background: var(--coral-dim);  color: var(--coral); font-weight: 600; }
.iv-race    { background: var(--amber-dim);  color: var(--amber); font-weight: 600; }
.iv-time    { margin-left: auto; font-size: 12px; opacity: 0.8; }

/* 스트레칭 */
.stretch-item { padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.stretch-item:last-child { border-bottom: none; }
.stretch-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.stretch-name { font-size: 13px; font-weight: 500; }
.stretch-dur  { font-size: 11px; color: var(--blue); font-weight: 500; flex-shrink: 0; }
.stretch-desc { font-size: 11px; color: var(--muted); margin-top: 3px; }
.stretch-link { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--blue); text-decoration: none; background: var(--blue-dim); padding: 3px 10px; border-radius: 99px; }

/* 휴식일 */
.rest-hero { text-align: center; padding: 40px 18px; }
.rest-icon { font-size: 48px; margin-bottom: 12px; }
.rest-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.rest-sub { font-size: 14px; color: var(--muted); }

/* 진행률 바 */
.progress-bar { height: 4px; background: var(--s2); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; background: var(--blue); transition: width 0.4s; }

/* 로딩 */
.loading { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--muted); font-size: 14px; }

/* C25K 주차/일 선택 */
.c25k-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.c25k-pill { padding: 5px 12px; border-radius: 99px; border: 0.5px solid var(--border); font-size: 12px; font-weight: 500; color: var(--muted); background: var(--s1); cursor: pointer; transition: all 0.15s; }
.c25k-pill.active { background: var(--green-dim); color: var(--green); border-color: rgba(74,222,128,0.3); }
.timer-bar { position:fixed; bottom:0; left:0; right:0; background:var(--s2);
  border-top:0.5px solid var(--border); padding:14px 18px; display:none;
  z-index:100; cursor:pointer; gap:12px; align-items:center; }
.timer-bar.active { display:flex; }
.timer-progress { flex:1; height:4px; background:var(--s3); border-radius:99px; overflow:hidden; }
.timer-progress-fill { height:100%; background:var(--blue); border-radius:99px; width:100%; }

.divider { height: 0.5px; background: var(--border); margin: 0 18px 20px; }
</style>
</head>
<body>

<div id="app"><div class="loading">루틴 불러오는 중...</div></div>
<div id="timer-bar" class="timer-bar" onclick="dismissTimer()">
  <span id="timer-label">휴식 중</span>
  <div class="timer-progress"><div id="timer-fill" class="timer-progress-fill"></div></div>
  <span id="timer-countdown"></span>
</div>

<script src="schedule.js"></script>
<script>
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_KO   = ['일','월','화','수','목','금','토'];
const setsDone = {}; // { exId: Set<setNum> }

let routine = null;
let soreness = null;
let c25kWeek = 1;
let c25kDay  = 1;
let timerInterval = null;
let timerTotal = 0;
let timerRemain = 0;

async function init() {
  try {
    const r = await fetch('routine.json');
    routine = await r.json();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML =
      `<div style="padding:24px;color:#f87171;font-size:13px">routine.json 로드 실패: ${e.message}</div>`;
  }
}

function todayKey() { return DAY_KEYS[new Date().getDay()]; }

function formatDate() {
  const d = new Date();
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DAY_KO[d.getDay()]}요일`;
}

function fmtSec(s) {
  if (s < 60) return `${s}초`;
  const m = Math.floor(s/60), sec = s%60;
  return sec ? `${m}분 ${sec}초` : `${m}분`;
}

function render() {
  const key = todayKey();
  const sched = routine.weekSchedule[key];
  const isRest = sched.type === 'rest';

  let html = '';

  // 헤더
  html += `<div class="hero">
    <div class="hero-date">${formatDate()}</div>
    <div class="hero-title">${isRest ? '휴식일' : sched.label}</div>
    <div class="hero-sub">${isRest ? '몸을 회복하는 것도 훈련이에요' : '오늘 루틴을 모두 따라해봐요'}</div>
  </div>`;

  // 주간 미니 스트립
  html += renderWeekStrip(key);

  if (isRest) {
    html += renderRestDay(key);
  } else {
    html += renderWorkoutDay(key, sched);
  }

  document.getElementById('app').innerHTML = html;
  bindEvents();
}

function renderWeekStrip(todayKey) {
  const days = DAY_KEYS.map((k, i) => {
    const sched = routine.weekSchedule[k];
    const isToday = k === todayKey;
    const cls = isToday ? 'today' : (sched.type === 'workout' ? 'workout' : 'rest');
    return `<div class="wday">
      <div class="wday-label">${DAY_KO[i]}</div>
      <div class="wday-dot ${cls}">${DAY_KO[i]}</div>
    </div>`;
  }).join('');
  return `<div class="week-strip">${days}</div>`;
}

function renderRestDay(key) {
  const isStretchDay = (key === 'wed' || key === 'sat');
  let html = `<div class="rest-hero">
    <div class="rest-icon">${key === 'sun' ? '😴' : '🧘'}</div>
    <div class="rest-title">${key === 'sun' ? '완전 휴식' : '가벼운 회복의 날'}</div>
    <div class="rest-sub">${key === 'sun' ? '오늘은 쉬어요. 내일을 위해.' : '스트레칭으로 유연성을 쌓아요'}</div>
  </div>`;
  if (isStretchDay) html += renderStretching(false);
  return html;
}

function renderWorkoutDay(key, sched) {
  let html = '';

  // 1. 근육통 체크
  html += `<div class="section">
    <div class="section-label">운동 전 체크</div>
    <div class="soreness-box">
      <div class="soreness-q">오늘 근육통 상태는?</div>
      <div class="soreness-btns">
        <button class="soreness-btn" onclick="setSoreness('none')" id="s-none">😊 없음</button>
        <button class="soreness-btn" onclick="setSoreness('mild')" id="s-mild">😐 약간 있음</button>
        <button class="soreness-btn" onclick="setSoreness('severe')" id="s-severe">😣 심함</button>
      </div>
      <div id="soreness-alert" class="alert"></div>
    </div>
  </div>`;

  // 2. 웨이트 루틴
  const workout = routine.workouts.find(w => w.id === sched.workout);
  html += renderWeightSection(workout);

  // 3. 유산소
  html += renderCardioSection(sched, key);

  // 4. 스트레칭
  const isLowerDay = sched.workout === 'lower-a' || sched.workout === 'lower-b';
  html += renderStretching(isLowerDay);

  return html;
}

function renderWeightSection(workout) {
  const exercises = workout.exercises.map((ex, exerciseIndex) => {
    const setCount = Number(/^(\d+)세트/.exec(ex.sets)?.[1] ?? 3);
    const restSecs = Number(/(\d+)/.exec(ex.rest)?.[1] ?? 60);
    const exId = exerciseIndex;
    const pills = Array.from({ length: setCount }, (_, idx) => {
      const setNum = idx + 1;
      const doneClass = setsDone[exId]?.has(setNum) ? ' set-pill-done' : '';
      return `<button class="set-pill${doneClass}" data-ex-id="${exId}" data-set-num="${setNum}" onclick="tapSet(${exId}, ${setNum}, ${restSecs})">${setNum}</button>`;
    }).join('');

    return `
    <div class="exercise-item">
      <div class="ex-left">
        <div class="ex-name">${ex.name}</div>
        ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
      </div>
      <div class="ex-right">
        <div class="ex-sets">${pills}</div>
        <div class="ex-rest">휴식 ${ex.rest}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="section">
    <div class="section-label">웨이트 트레이닝</div>
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${workout.label} <span class="badge badge-blue">${workout.focus}</span></div>
          <div class="card-sub">워밍업: ${workout.warmup}</div>
        </div>
      </div>
      <div class="card-body">${exercises}</div>
    </div>
  </div>`;
}

function renderCardioSection(sched, key) {
  const isInterval = sched.cardio === 'interval';

  // C25K 주차 계산 (startDate 기준)
  const start = new Date(routine.meta.startDate);
  const today = new Date();
  const diffDays = Math.floor((today - start) / 86400000);
  const inferredWeek = Math.min(9, Math.max(1, Math.floor(diffDays / 7) + 1));
  c25kWeek = inferredWeek;

  // 이 주의 C25K 날짜 (월/목 인터벌 기준)
  const c25kDayMap = { mon: 1, thu: 2 };
  c25kDay = c25kDayMap[key] || 1;

  const cardioLabel = isInterval ? '인터벌 런 (C25K 트레드밀)' : 'Zone 2 유산소';
  const cardioDesc  = isInterval
    ? `C25K ${inferredWeek}주차 Day ${c25kDay} · 상체 웨이트 후 진행`
    : '트레드밀 시속 5.5~6.5km + 경사 2~3도 · 심박 120~135 bpm';

  let content = '';
  if (isInterval) {
    content = renderC25K(inferredWeek, c25kDay);
  } else {
    content = `<div style="padding:0 0 4px">
      <div style="font-size:13px;color:var(--muted);line-height:1.7">
        대화할 수 있는 속도로 꾸준히 달려요.<br>
        하체 운동 후라 다리가 피로할 수 있으니 무리하지 마세요.
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <span class="badge badge-teal">심박 120~135 bpm</span>
        <span class="badge badge-blue">경사 2~3도</span>
        <span class="badge badge-amber">15~20분</span>
      </div>
    </div>`;
  }

  return `<div class="section" id="cardio-section">
    <div class="section-label">유산소</div>
    <div class="card" id="cardio-card">
      <div class="card-header">
        <div>
          <div class="card-title">${cardioLabel}</div>
          <div class="card-sub">${cardioDesc}</div>
        </div>
        ${isInterval ? `<span class="badge badge-green">${inferredWeek}주차</span>` : `<span class="badge badge-teal">Zone 2</span>`}
      </div>
      <div class="card-body" id="cardio-body">${content}</div>
    </div>
    <div id="cardio-override-alert" class="alert"></div>
  </div>`;
}

function renderC25K(week, day) {
  // 주차 범위 클램프
  const w = Math.min(9, Math.max(1, week));
  let intervals;
  try {
    intervals = getSchedule('c25k_treadmill', w, day);
  } catch(e) {
    return `<div style="color:var(--muted);font-size:13px">데이터 없음</div>`;
  }

  const typeLabel = { warmup:'워밍업', run:'달리기', walk:'걷기', cooldown:'쿨다운' };
  const typeCls   = { warmup:'iv-warmup', run:'iv-run', walk:'iv-walk', cooldown:'iv-cooldown' };

  // 연속되는 같은 타입 묶기
  const grouped = [];
  intervals.forEach(iv => {
    const last = grouped[grouped.length-1];
    if (last && last.type === iv.type) {
      last.count++;
      last.totalDur += iv.duration;
    } else {
      grouped.push({ type: iv.type, count: 1, totalDur: iv.duration, duration: iv.duration });
    }
  });

  // 원래 intervals 그대로 표시 (묶지 않고)
  const rows = intervals.map(iv => `
    <div class="iv-row ${typeCls[iv.type] || 'iv-walk'}">
      <span>${typeLabel[iv.type] || iv.type}</span>
      <span class="iv-time">${fmtSec(iv.duration)}</span>
    </div>`).join('');

  const total = intervals.reduce((s,iv)=>s+iv.duration,0);
  return `
    <div class="c25k-nav" id="c25k-week-nav">${renderC25KWeekPills(w)}</div>
    <div id="c25k-intervals" class="interval-list">${rows}</div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--muted)">총 ${fmtSec(total)}</span>
      <span class="badge badge-green">Day ${day}</span>
    </div>`;
}

function renderC25KWeekPills(activeWeek) {
  return Array.from({length:9},(_,i)=>i+1).map(w =>
    `<button class="c25k-pill${w===activeWeek?' active':''}" onclick="changeC25KWeek(${w})">${w}주</button>`
  ).join('');
}

function renderStretching(isLowerDay) {
  const items = [...routine.stretching.daily, ...(isLowerDay ? routine.stretching.lowerDayExtra : [])];
  const rows = items.map(s => `
    <div class="stretch-item">
      <div class="stretch-row">
        <div class="stretch-name">${s.name}</div>
        <div class="stretch-dur">${s.duration}</div>
      </div>
      <div class="stretch-desc">${s.desc}</div>
      <a href="${s.videoUrl}" target="_blank" class="stretch-link">영상 보기 ↗</a>
    </div>`).join('');

  return `<div class="section">
    <div class="section-label">스트레칭 ${isLowerDay ? '(하체 날 +5분)' : ''}</div>
    <div class="card"><div class="card-body">${rows}</div></div>
  </div>`;
}

function setSoreness(level) {
  soreness = level;
  ['none','mild','severe'].forEach(l => {
    const btn = document.getElementById('s-'+l);
    btn.className = 'soreness-btn' + (l===level ? ` selected-${l}` : '');
  });

  const alert = document.getElementById('soreness-alert');
  const key = todayKey();
  const sched = routine.weekSchedule[key];
  const rules = routine.cardioRules['soreness_'+level][sched.cardio];

  if (level === 'none') {
    alert.className = 'alert show alert-green';
    alert.textContent = '컨디션 좋네요! 오늘 루틴 그대로 진행해요.';
  } else if (level === 'mild') {
    alert.className = 'alert show alert-amber';
    alert.textContent = rules.note;
    applyCardioOverride(rules.intensity, rules.note);
  } else {
    alert.className = 'alert show alert-coral';
    alert.textContent = rules.note;
    applyCardioOverride(rules.intensity, rules.note);
  }
}

function applyCardioOverride(intensity, note) {
  const el = document.getElementById('cardio-override-alert');
  if (!el) return;
  if (intensity === 'skip') {
    el.className = 'alert show alert-coral';
    el.textContent = '유산소 생략 권장: ' + note;
    const body = document.getElementById('cardio-body');
    if (body) body.style.opacity = '0.4';
  } else if (intensity === 'reduced') {
    el.className = 'alert show alert-amber';
    el.textContent = note;
  } else {
    el.className = 'alert';
  }
}

function changeC25KWeek(w) {
  c25kWeek = w;
  const body = document.getElementById('c25k-intervals');
  const nav  = document.getElementById('c25k-week-nav');
  if (!body || !nav) return;

  let intervals;
  try { intervals = getSchedule('c25k_treadmill', w, c25kDay); } catch(e) { return; }

  const typeLabel = { warmup:'워밍업', run:'달리기', walk:'걷기', cooldown:'쿨다운' };
  const typeCls   = { warmup:'iv-warmup', run:'iv-run', walk:'iv-walk', cooldown:'iv-cooldown' };

  body.innerHTML = intervals.map(iv => `
    <div class="iv-row ${typeCls[iv.type]||'iv-walk'}">
      <span>${typeLabel[iv.type]||iv.type}</span>
      <span class="iv-time">${fmtSec(iv.duration)}</span>
    </div>`).join('');

  nav.innerHTML = renderC25KWeekPills(w);
}

function tapSet(exId, setNum, restSecs) {
  if (setsDone[exId]?.has(setNum)) {
    setsDone[exId].delete(setNum);
    updateSetPill(exId, setNum, false);
    return;
  }

  setsDone[exId] ??= new Set();
  setsDone[exId].add(setNum);
  updateSetPill(exId, setNum, true);
  startTimer(restSecs);
}

function updateSetPill(exId, setNum, isDone) {
  const pill = document.querySelector(`[data-ex-id="${exId}"][data-set-num="${setNum}"]`);
  if (!pill) return;
  pill.classList.toggle('set-pill-done', isDone);
}

function startTimer(secs) {
  clearInterval(timerInterval);
  timerTotal = timerRemain = secs;
  const bar = document.getElementById('timer-bar');
  bar.classList.add('active');
  updateTimerUI();
  timerInterval = setInterval(() => {
    timerRemain--;
    if (timerRemain <= 0) { timerDone(); return; }
    updateTimerUI();
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timer-countdown').textContent = timerRemain + '초';
  const pct = (timerRemain / timerTotal) * 100;
  document.getElementById('timer-fill').style.width = pct + '%';
}

function timerDone() {
  clearInterval(timerInterval);
  document.getElementById('timer-bar').classList.remove('active');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function dismissTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer-bar').classList.remove('active');
}

function bindEvents() {}

init();
</script>
</body>
